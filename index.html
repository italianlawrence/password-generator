<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel = 'stylesheet' href = 'index.css'>
    <title> Password generator </title>
</head>
<body>
    
    <div class = 'content-wrapper'>
        <h1> Generate a <span class = 'random'>random password</span> </h1>
        <p class = 'never'> Never use an insecure password again </p>

        
        <input type = 'number' id = 'length-of-pass' placeholder = 'How long would you like your password(s) to be?'>
        <button id = 'generate' onclick = 'generatePassword()'> Generate password </button>
       
        
        <div class = 'passwords'>
            <span class = 'pass-wrapper' id = 'pass-wrapper-1'>Password 1</span>
            <span class = 'pass-wrapper' id = 'pass-wrapper-2'>Password 2</span>
        </div>
    </div>

    <script src = 'index.js'></script>
</body>
</html>
